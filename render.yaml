services:
  - type: web
    name: e-index
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://e-index-fr8e.onrender.com
      - key: CORS_ORIGINS
        value: https://e-index-fr8e.onrender.com
      - key: DATABASE_URL
        sync: false
